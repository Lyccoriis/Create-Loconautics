name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "JDK 25"
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew build
      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          path: |
            build/libs/*.jar

