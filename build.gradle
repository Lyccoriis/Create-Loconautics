
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// I'm going to kill you lyc
repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.theillusivec4.top/" }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }

    maven {
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }

    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }

    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup("maven.modrinth") }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArguments.addAll '--username',
                    (findProperty('mcUser') ?: 'Lyc').toString()
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            jvmArguments.addAll '-Xms2G', '-Xmx8G'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    sableJarExtraction
    aeroBundle
}

def sableCompanionVersion =
        providers.gradleProperty('sable_companion_version').orElse('1.6.0').get()

def simulatedVersion =
        providers.gradleProperty('simulated_version').orElse('1.3.2').get()

def veilVersion =
        providers.gradleProperty('veil_version').orElse('4.3.2').get()

tasks.register('extractSableRapier', Copy) {
    from({ configurations.sableJarExtraction.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/dev.ryanhcode.sable.sable-sable_rapier-*.jar'
    }

    eachFile {
        it.relativePath = new RelativePath(true, 'sable-rapier.jar')
    }

    includeEmptyDirs = false
    into layout.buildDirectory.dir('generated/sable-deps')
}

tasks.register('extractAeronautics', Copy) {
    from({ configurations.aeroBundle.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/dev.eriksonn.aeronautics.aeronautics-neoforge-*.jar'
    }
    eachFile { it.relativePath = new RelativePath(true, 'aeronautics-neoforge.jar') }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('generated/aero-deps')
}

dependencies {
    aeroBundle("maven.modrinth:oWaK0Q19:1.3.2+mc1.21.1") { transitive = false }
    compileOnly fileTree(layout.buildDirectory.dir('generated/aero-deps')) {
        builtBy(tasks.named('extractAeronautics'))
    }
    compileOnly("maven.modrinth:GWp4jCJj:5.11.7") { transitive = false }
    compileOnly("maven.modrinth:ApkoHNO9:1.1.4") { transitive = false }
    compileOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1") { transitive = false }
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Lyc I'm going to kill you
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }

    runtimeOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }

    implementation(
            "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sableCompanionVersion}"
    )

    implementation(
            "dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulatedVersion}"
    ) {
        transitive = false
    }

    implementation(
            "foundry.veil:veil-neoforge-${minecraft_version}:${veilVersion}"
    )

    sableJarExtraction(
            "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"
    ) {
        transitive = false
    }

    compileOnly fileTree(layout.buildDirectory.dir('generated/sable-deps')) {
        builtBy(tasks.named('extractSableRapier'))
    }

    compileOnly(
            "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}"
    )

    localRuntime(
            "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}"
    )
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
